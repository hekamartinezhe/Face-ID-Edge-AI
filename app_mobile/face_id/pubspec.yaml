name: face_id
description: "Sistema de asistencia facial con Orquestador de Carga Híbrida"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # Iconos básicos
  cupertino_icons: ^1.0.8

  # Gestión de cámara e imagen (Fix para S23 Ultra)
  camera: ^0.12.0
  image: ^4.2.0
  
  # IA y Modelos
  tflite_flutter: ^0.12.1
  google_mlkit_face_detection: ^0.13.2
  
  # Manejo de rutas y archivos
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Comunicación con la API y Persistencia
  http: ^1.1.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Si tienes assets (fotos o modelos .tflite), agrégalos aquí abajo:
  # assets:
  #   - assets/models/